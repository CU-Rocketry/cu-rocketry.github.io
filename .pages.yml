media:
  - name: images
    label: Images
    input: public/media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: cur-logo
    label: Logo
    input: public/media/cur-logo
    output: /media/cur-logo
    rename: safe
    categories: [image]
  - name: sponsor-logos
    label: Sponsor Logos
    input: public/media/sponsor-logos
    output: /media/sponsor-logos
    rename: safe
    categories: [image]
  - name: headshots
    label: Eboard Headshots
    input: public/media/images/headshots
    output: /media/images/headshots
    rename: safe
    categories: [image]
  - name: docs
    label: Documents
    input: public/media/docs
    output: /media/docs
    rename: safe
    extensions: [pdf]

components:
  bandTheme:
    type: select
    label: Theme
    default: white
    options:
      values:
        - { value: white, label: "White" }
        - { value: warm-light, label: "Warm Light" }
        - { value: warm-dark, label: "Warm Dark" }
        - { value: green, label: "Green" }

  divider:
    type: object
    label: Divider
    fields:
      - name: style
        label: Divider Shape
        type: select
        default: none
        options:
          values:
            - { value: none, label: None }
            - { value: concave-up, label: Concave Up }
            - { value: concave-down, label: Concave Down }
            - { value: wavy, label: Wavy }
            - { value: slant-right, label: Slant Right }
            - { value: slant-left, label: Slant Left }
            - { value: triangle, label: Triangle }
            - { value: chevron, label: Chevron }
            - { value: zigzag, label: Zigzag }
      - name: stroke
        label: Divider Stroke Color
        type: select
        default: none
        options:
          values:
            - { value: none, label: None }
            - { value: gold, label: Gold }
            - { value: green, label: Green }
            - { value: white, label: White }
            - { value: warm-dark, label: Warm Dark }

  splitBand:
    type: object
    label: Text and Image
    fields:
      - name: theme
        label: Theme
        component: bandTheme
        default: white
      - name: imageSide
        label: Image Position
        type: select
        default: left
        options:
          values:
            - { value: left, label: Left }
            - { value: right, label: Right }
      - name: image
        label: Image
        type: image
        options:
          media: images
      - { name: caption, label: Image Caption, type: string }
      - { name: text, label: Text, type: rich-text }
      - name: divider
        label: Divider
        component: divider

  textBand:
    type: object
    label: Text
    fields:
      - name: theme
        label: Theme
        component: bandTheme
      - { name: text, label: Content, type: rich-text }
      - name: divider
        label: Divider
        component: divider

  accordion:
    type: object
    label: Accordion
    fields:
      - name: theme
        label: Theme
        component: bandTheme
      - { name: heading, label: Heading, type: string }
      - name: items
        label: Accordion Items
        type: object
        list: true
        fields:
          - { name: title, label: Summary, type: string, required: true }
          - { name: body, label: Details, type: rich-text }
          - name: photo
            label: Image
            type: image
            options:
              media: images
      - name: divider
        label: Bottom Divider
        component: divider

  peopleGrid:
    type: object
    label: People Grid
    fields:
      - name: theme
        label: Theme
        component: bandTheme
        default: white
      - { name: heading, label: Heading, type: string }
      - name: people
        label: People
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string, required: true }
          - { name: year, label: Year, type: string, required: true }
          - name: headshot
            label: Headshot
            type: image
            options:
              media: headshots
      - name: divider
        label: Divider
        component: divider

  pdfEmbed:
    type: object
    label: PDF Viewer Band
    fields:
      - name: theme
        label: Theme
        component: bandTheme
      - { name: text, label: Text, type: rich-text }
      - name: pdfUrl
        label: PDF Document
        type: file
        required: true
        options:
          media: docs
          extensions: [pdf]
      - name: divider
        label: Divider
        component: divider

content:
  # --- 1. Global Site & Landing Hero Settings ---
  - name: settings
    label: Introduction
    type: file
    path: src/content/settings.yml
    fields:
      - name: siteTitle
        label: Site Title
        type: string
        default: Clarkson University Rocketry
      - name: heroTitle
        label: Hero Headline
        type: string
        default: Clarkson University Rocketry
      - name: heroFallbackImage
        label: Hero Image
        type: image
        options:
          media: images
      - name: heroDivider
        label: Hero Bottom Divider
        component: divider
      - name: missionTheme
        label: Mission Background Theme
        component: bandTheme
      - name: missionBody
        label: Landing Mission Text
        type: rich-text
      - name: missionDivider
        label: Mission Bottom Divider
        component: divider
      - name: socials
        label: Social Media Links
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: discord, label: Discord Invite URL, type: string }
      - name: sections
        label: Extra Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # Subteams and Eboard listing on landing page
  - name: about
    label: About
    type: file
    path: src/content/about.yml
    fields:
      - name: subteamsTheme
        label: Theme
        component: bandTheme
      - name: subteams
        label: Subteams
        type: object
        list: true
        fields:
          - { name: name, label: Subteam Name, type: string, required: true }
          - { name: description, label: Description, type: rich-text }
          - name: photo
            label: Image
            type: image
            options:
              media: images
      - name: subteamsDivider
        label: Divider
        component: divider
      - name: eboardTheme
        label: Theme
        component: bandTheme
        default: white
      - name: people
        label: Eboard
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string, required: true }
          - { name: year, label: Year, type: string, required: true }
          - name: headshot
            label: Headshot Photo
            type: image
            options:
              media: headshots
      - name: eboardDivider
        label: Divider
        component: divider

  # --- 3. Sponsors (Drives BOTH the Landing Marquee & Sponsors Page) ---
  - name: sponsors
    label: Sponsors
    type: file
    path: src/content/sponsors.yml
    fields:
      - name: intro
        label: Sponsors Page Intro
        type: rich-text
      - name: list
        label: Sponsor List
        type: object
        list: true
        fields:
          - { name: name, label: Sponsor Name, type: string, required: true }
          - name: tier
            label: Sponsorship Tier
            type: select
            options:
              values:
                - { value: Platinum, label: Platinum }
                - { value: Gold, label: Gold }
                - { value: Green, label: Green }
                - { value: Partner, label: Partner }
          - { name: url, label: Sponsor Website, type: string }
          - name: logo
            label: Sponsor Logo
            type: image
            options:
              media: sponsor-logos
          - { name: description, label: About This Sponsor, type: text }
          - name: showInMarquee
            label: Show in Landing Page Scroller
            type: boolean
            default: true
      - name: sections
        label: Extra Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # --- 4. Papers & Technical Reports ---
  - name: papers
    label: Papers & Reports
    type: file
    path: src/content/papers.yml
    fields:
      - name: intro
        label: Papers Intro
        type: rich-text
      - name: documents
        label: Published Papers / Reports
        type: object
        list: true
        fields:
          - { name: title, label: Report Title, type: string, required: true }
          - { name: year, label: Competition Year, type: string }
          - { name: summary, label: Short Summary, type: text }
          - name: pdfUrl
            label: PDF Document
            type: file
            required: true
            options:
              media: docs
              extensions: [pdf]
      - name: sections
        label: Extra Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # --- 5. Rockets ---
  - name: rockets
    label: Rockets
    type: collection
    path: src/content/rockets
    filename: "{primary}.md"
    view:
      fields: [title, year, featured]
      sort: [year, title]
      default: { sort: year, order: desc }
    fields:
      - { name: title, label: Rocket Name, type: string, required: true }
      - { name: year, label: Competition Year, type: string, required: true, description: "Used to sort rockets newest-first in the dropdown" }
      - { name: featured, label: Show in Dropdown, type: boolean, default: true }
      - name: heroImage
        label: Header Image
        type: image
        options:
          media: images
      - name: sections
        label: Extra Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # --- 6. Projects ---
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, featured, order]
      sort: [order, title]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Project Name, type: string, required: true }
      - { name: order, label: Dropdown Order, type: number, default: 99, description: "Controls dropdown order (lower numbers appear first)" }
      - { name: featured, label: Show in Dropdown, type: boolean, default: true }
      - name: heroImage
        label: Header Image
        type: image
        options:
          media: images
      - name: sections
        label: Extra Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed
