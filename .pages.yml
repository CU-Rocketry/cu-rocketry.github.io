media:
  - name: images
    label: Images
    input: public/media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: cur-logo
    label: Logo
    input: public/media/cur-logo
    output: /media/cur-logo
    rename: safe
    categories: [image]
  - name: sponsor-logos
    label: Sponsor Logos
    input: public/media/sponsor-logos
    output: /media/sponsor-logos
    rename: safe
    categories: [image]
  - name: headshots
    label: Eboard Headshots
    input: public/media/images/headshots
    output: /media/images/headshots
    rename: safe
    categories: [image]
  - name: docs
    label: Documents
    input: public/media/docs
    output: /media/docs
    rename: safe
    extensions: [pdf]

components:
  bandTheme:
    type: select
    label: Theme
    default: white
    options:
      values:
        - { value: white, label: "White" }
        - { value: warm-light, label: "Warm Light" }
        - { value: warm-dark, label: "Warm Dark" }
        - { value: green, label: "Green" }

  divider:
    type: object
    label: Divider
    fields:
      - name: style
        label: Divider Shape
        type: select
        default: none
        options:
          values:
            - { value: none, label: None }
            - { value: concave-up, label: Concave Up }
            - { value: concave-down, label: Concave Down }
            - { value: wavy, label: Wavy }
            - { value: slant-right, label: Slant Right }
            - { value: slant-left, label: Slant Left }
            - { value: triangle, label: Triangle }
            - { value: chevron, label: Chevron }
            - { value: zigzag, label: Zigzag }
      - name: stroke
        label: Divider Stroke Color
        type: select
        default: none
        options:
          values:
            - { value: none, label: None }
            - { value: gold, label: Gold }
            - { value: green, label: Green }
            - { value: white, label: White }
            - { value: warm-dark, label: Warm Dark }

  splitBand:
    type: object
    label: Split Text & Image Band
    fields:
      - name: theme
        label: Background Theme
        component: bandTheme
        default: grey
      - name: imageSide
        label: Image Position
        type: select
        default: left
        options:
          values:
            - { value: left, label: Left }
            - { value: right, label: Right }
      - name: image
        label: Section Photo
        type: image
        options:
          media: images
      - { name: caption, label: Image Caption (Optional), type: string }
      - { name: heading, label: Section Heading (Optional), type: string }
      - { name: text, label: Paragraph Content, type: rich-text }
      - name: divider
        label: Bottom Divider
        component: divider

  textBand:
    type: object
    label: Text Band
    fields:
      - name: theme
        label: Background Theme
        component: bandTheme
      - { name: heading, label: Section Heading (Optional), type: string }
      - { name: text, label: Content, type: rich-text }
      - name: divider
        label: Bottom Divider
        component: divider

  accordion:
    type: object
    label: Accordion Band
    fields:
      - name: theme
        label: Background Theme
        component: bandTheme
      - { name: heading, label: Section Heading (Optional), type: string }
      - name: items
        label: Accordion Items
        type: object
        list: true
        fields:
          - { name: title, label: Item Title, type: string, required: true }
          - { name: body, label: Description, type: rich-text }
          - name: photo
            label: Item Photo (Optional)
            type: image
            options:
              media: images
      - name: divider
        label: Bottom Divider
        component: divider

  peopleGrid:
    type: object
    label: People Grid Band
    fields:
      - name: theme
        label: Background Theme
        component: bandTheme
        default: light
      - { name: heading, label: Section Heading (Optional), type: string }
      - name: people
        label: People
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string, required: true }
          - { name: year, label: Year, type: string, required: true }
          - name: headshot
            label: Headshot Photo
            type: image
            options:
              media: headshots
      - name: divider
        label: Bottom Divider
        component: divider

  pdfEmbed:
    type: object
    label: PDF Viewer Band
    fields:
      - name: theme
        label: Background Theme
        component: bandTheme
      - { name: title, label: Document Title, type: string, required: true }
      - { name: summary, label: Short Summary (Optional), type: text }
      - name: pdfUrl
        label: PDF Document
        type: file
        required: true
        options:
          media: docs
          extensions: [pdf]
      - name: divider
        label: Bottom Divider
        component: divider

content:
  # --- 1. Global Site & Landing Hero Settings ---
  - name: settings
    label: Site & Hero Settings
    type: file
    path: src/content/settings.yml
    fields:
      - name: siteTitle
        label: Site Title
        type: string
        default: Clarkson University Rocketry
      - name: heroTitle
        label: Hero Headline
        type: string
        default: Clarkson University Rocketry
      - name: heroFallbackImage
        label: Hero Image
        type: image
        options:
          media: images
      - name: heroDivider
        label: Hero Bottom Divider
        component: divider
      - name: missionTheme
        label: Mission Background Theme
        component: bandTheme
      - name: missionBody
        label: Landing Mission Text
        type: rich-text
      - name: missionDivider
        label: Mission Bottom Divider
        component: divider
      - name: socials
        label: Social Media Links
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: discord, label: Discord Invite URL, type: string }

  # --- 2. Home Subteams & Eboard (Landing Page Sections) ---
  - name: about
    label: Subteams & Eboard
    type: file
    path: src/content/about.yml
    fields:
      - name: subteamsTheme
        label: Subteams Background Theme
        component: bandTheme
      - name: subteams
        label: Subteams (Accordion)
        type: object
        list: true
        fields:
          - { name: name, label: Subteam Name, type: string, required: true }
          - { name: description, label: Description, type: rich-text }
          - name: photo
            label: Subteam Photo (Optional)
            type: image
            options:
              media: images
      - name: subteamsDivider
        label: Subteams Bottom Divider
        component: divider
      - name: eboardTheme
        label: Eboard Background Theme
        component: bandTheme
        default: light
      - name: people
        label: Eboard
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string, required: true }
          - { name: year, label: Year, type: string, required: true }
          - name: headshot
            label: Headshot Photo
            type: image
            options:
              media: headshots
      - name: eboardDivider
        label: Eboard Bottom Divider
        component: divider

  # --- 3. Sponsors (Drives BOTH the Landing Marquee & Sponsors Page) ---
  - name: sponsors
    label: Sponsors
    type: file
    path: src/content/sponsors.yml
    fields:
      - name: intro
        label: Sponsors Page Intro
        type: rich-text
      - name: brochurePdfUrl
        label: Sponsorship Brochure PDF
        type: file
        options:
          media: docs
          extensions: [pdf]
      - name: list
        label: Sponsor List
        type: object
        list: true
        fields:
          - { name: name, label: Sponsor Name, type: string, required: true }
          - name: tier
            label: Sponsor Tier
            type: select
            options:
              values:
                - { value: Platinum, label: Platinum }
                - { value: Gold, label: Gold }
                - { value: Green, label: Green }
                - { value: Partner, label: Partner }
          - { name: url, label: Sponsor Website, type: string }
          - name: logo
            label: Sponsor Logo
            type: image
            options:
              media: sponsor-logos
          - { name: description, label: About This Sponsor, type: text }
          - name: showInMarquee
            label: Show in Landing Page Scroller
            type: boolean
            default: true
      - name: sections
        label: Extra Page Sections (Optional)
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # --- 4. Papers & Technical Reports ---
  - name: papers
    label: Papers & Reports
    type: file
    path: src/content/papers.yml
    fields:
      - name: intro
        label: Papers Intro
        type: rich-text
      - name: documents
        label: Published Papers / Reports
        type: object
        list: true
        fields:
          - { name: title, label: Report Title, type: string, required: true }
          - { name: year, label: Competition Year, type: string }
          - { name: summary, label: Short Summary, type: text }
          - name: pdfUrl
            label: PDF Document
            type: file
            required: true
            options:
              media: docs
              extensions: [pdf]
      - name: sections
        label: Extra Page Sections (Optional)
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # --- 5. Projects (Alternating Color Band Pages like Aurora) ---
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, year, featured]
      sort: [year, title]
      default: { sort: year, order: desc }
    fields:
      - { name: title, label: Rocket / Project Name, type: string, required: true }
      - { name: year, label: Year (e.g. 2026), type: string, required: true }
      - { name: featured, label: Show in Projects Dropdown, type: boolean, default: true }
      - name: heroImage
        label: Header Image
        type: image
        options:
          media: images
      - name: sections
        label: Page Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: splitBand
            component: splitBand
          - name: textBand
            component: textBand
          - name: accordion
            component: accordion
          - name: peopleGrid
            component: peopleGrid
          - name: pdfEmbed
            component: pdfEmbed

  # --- 6. Blog Posts / Build Logs ---
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Post Title, type: string, required: true }
      - { name: date, label: Publish Date, type: date, required: true }
      - { name: author, label: Author, type: string }
      - { name: draft, label: Draft, type: boolean, default: false }
      - name: coverImage
        label: Cover Image
        type: image
        options:
          media: images
      - { name: excerpt, label: Short Summary, type: text }
      - { name: body, label: Article Body, type: rich-text }
