missionBody: >+
  # Our Mission


  The Clarkson University Rocketry Team is a student-led competitive design team
  where students design and fabricate High Power Rockets for personal missions
  and international rocketry competitions. Team members apply multidisciplinary
  engineering principles to practical rocketry applications using Clarkson
  University’s composites laboratories.

