intro: SPEED Team sponsorships include three donation levels in addition to
  industry partners. Clarkson University Rocketry thanks all of our sponsorship
  partners for their support in making our projects possible!
brochurePdfUrl: /media/docs/2026-2027-cur-sponsorship-brochure.pdf
list:
  - name: TANIQ
    tier: Platinum
    url: https://www.taniq.com/
    logo: /media/sponsor-logos/taniq.png
    description: TANIQ assists manufacturers with developing composite products and
      production processes. With 18 years of experience, our team has extensive
      knowledge of designing composite parts using TaniqWind software and FEA
      software for analysis. TANIQ has two in-house robotic prototyping systems
      that are used for internal R&D to support our clients with their product
      and process development.
    showInMarquee: true
  - name: Siemens Energy
    tier: Gold
    url: https://www.siemens-energy.com/
    logo: /media/sponsor-logos/siemens-energy.png
    description: >-
      Siemens Energy is a leader in energy technology supporting companies and
      countries worldwide in building resilient, affordable and sustainable
      energy systems society depends on.

      For more than a century, Siemens Energy has supported America’s energy
      landscape—combining global expertise with local manufacturing, innovation,
      and service to meet the nation’s growing energy needs.
    showInMarquee: true
  - name: Kennametal
    tier: Gold
    url: https://www.kennametal.com/
    logo: /media/sponsor-logos/kennametal.png
    description: Behind every modern marvel—from the airplanes in the sky to the
      phone in your hand—are incredibly precise and durable materials.
      Kennametal creates the advanced tooling and material solutions that help
      make it all possible.
    showInMarquee: true
  - name: THK
    tier: Gold
    url: https://www.thk.com/
    logo: /media/sponsor-logos/thk.png
    description: "THK's creative ideas and unique technology made the company
      worldwide pioneers in the development of the Linear Motion (LM) Guide
      mechanism. Today, our LM Guide devices are an indispensable component of
      mechanical and electronic systems in a wide variety of industries. "
    showInMarquee: true
  - name: GE Aerospace
    tier: Gold
    url: https://www.geaerospace.com/
    logo: /media/sponsor-logos/ge-aerospace.png
    description: GE Aerospace is a world leading provider of jet and turboprop
      engines, as well as integrated systems for commercial, military, business
      and general aviation aircraft.
    showInMarquee: false
  - name: Sierra Circuits
    tier: Gold
    url: https://www.protoexpress.com/
    logo: /media/sponsor-logos/sierra.png
    description: At Sierra, we deliver high-quality boards that power AI-driven
      robotics and help you reduce time to market by 30% with our in-house
      fabrication, assembly, and quick-turn prototyping capabilities.
    showInMarquee: true
  - name: NextPCB
    tier: Gold
    url: https://www.nextpcb.com/
    logo: /media/sponsor-logos/nextpcb.png
    description: NextPCB, a subsidiary of Huaqiu (HQ) is the world's leading
      industrial digital manufacturing platform for PCB manufacture, PCB
      assembly, components distribution, and electronics design verification
      tools since founding in 2011. Our passion for reliable, fast and
      cost-effective electronics manufacturing services has transformed the
      industry, streamlining the entire production process and allowing
      production efficiency and cost-savings to reach record highs without
      compromising on reliability.
    showInMarquee: true
  - name: Sipeed
    tier: Green
    url: https://sipeed.com/
    logo: /media/sponsor-logos/sipeed.png
    description: Sipeed offers AI-enabled open-source hardware. Application areas
      include robotics, agriculture, retail, and other industries.
    showInMarquee: false
  - name: Urgenex
    tier: Green
    url: https://urgenexrc.com/
    logo: /media/sponsor-logos/urgenex.png
    description: URGENEX is a professional RC battery manufacturer, providing high
      performance RC batteries and excellent customer service for our customers
      from all over the world. Keeps your fun going longer. Choose URGENEX,
      Choose the power.
    showInMarquee: false
  - name: Snap-On
    tier: Partner
    url: https://www.snapon.com/
    logo: /media/sponsor-logos/snap-on.png
    description: Snap-on Incorporated is an American designer, manufacturer and
      marketer of high-end tools and equipment for professional use in the
      transportation industry including the automotive, heavy duty, equipment,
      marine, aviation, and railroad industries.
    showInMarquee: true
