name: Submit draft PR for review

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload JSON
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR from draft to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_PAYLOAD: ${{ inputs.payload }}
        run: |
          git fetch origin master draft

          # Exit cleanly if draft has no new commits ahead of master
          AHEAD=$(git rev-list --count origin/master..origin/draft)
          if [ "$AHEAD" -eq 0 ]; then
            echo "Cancelled b/c no new changes on draft"
            exit 0
          fi

          # Exit cleanly if a draft -> master PR is already open
          EXISTING_PR=$(gh pr list --head draft --base master --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Cancelled b/c the following PR is already open for review: $EXISTING_PR"
            exit 0
          fi

          # Parse title, summary, and triggering user from Pages CMS JSON payload
          TITLE=$(jq -r '.inputs.title' // "Update website" <<< "$PAGES_PAYLOAD")
          SUMMARY=$(jq -r '.inputs.summary // "Content updates in Pages CMS"' <<< "$PAGES_PAYLOAD")
          AUTHOR=$(jq -r '.triggeredBy.githubUsername // .triggeredBy.name // "Pages CMS"' <<< "$PAGES_PAYLOAD")

          gh pr create \
            --base master \
            --head draft \
            --title "$TITLE" \
            --body "$(printf "%s\n\nTriggered from Pages CMS by @%s." "$SUMMARY" "$AUTHOR")"